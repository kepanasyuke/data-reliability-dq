[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-dq"
version = "0.3.0"
description = "Data Reliability / Data Quality framework for an analytical banking warehouse (Greenplum, Airflow, Python)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "data-reliability-dq contributors" }]
keywords = ["data-quality", "data-reliability", "greenplum", "airflow", "sql", "incident-management"]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8"]

[project.scripts]
reliability = "reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
