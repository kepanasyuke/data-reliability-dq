name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile check (dags included, Airflow not required)
        run: python -m compileall -q src dags tests run.py

      - name: Tests
        run: pytest -q

  pipeline:
    name: demo pipeline + DQ gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seed demo warehouse with defects
        run: python run.py seed

      - name: DQ catalogue must fail on broken data
        run: |
          set +e
          python run.py run --fail-on P1
          code=$?
          echo "exit_code=$code"
          # ненулевой exit означает, что P1-проверки действительно поймали дефекты
          if [ "$code" -ne 1 ]; then
            echo "::error::DQ gate did not detect the injected P1 defects"
            exit 1
          fi

      - name: Incident summary
        run: python run.py status

      - name: Reload clean data, checks must be green
        run: |
          python run.py seed --clean
          python run.py run

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dq-artifacts-py312
          path: |
            artifacts/dq_report.md
            artifacts/metrics/dq.prom
            artifacts/notifications.jsonl
          retention-days: 14
